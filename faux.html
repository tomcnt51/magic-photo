<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Magic Photo</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:sans-serif; touch-action:manipulation; }
  #manque { display:none; height:100%; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px; box-sizing:border-box; }
  button.principal { width:260px; padding:18px; font-size:18px; border:none; border-radius:14px; background:#6c4cff; color:#fff; }
  #accueil { display:none; position:fixed; inset:0; background-size:cover; background-position:center; }
  #camera { display:none; position:fixed; inset:0; background:#000; }
  #video { width:100%; height:100%; object-fit:cover; }
  #suivi { position:absolute; inset:0; pointer-events:none; }
  #declencheur { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); width:74px; height:74px; border-radius:50%; background:#fff; border:6px solid #888; }
  #resultat { display:none; position:fixed; inset:0; width:100%; height:100%; touch-action:none; background:#000; }
  .barre { display:none; position:fixed; bottom:30px; left:0; right:0; flex-direction:column; align-items:center; gap:12px; z-index:5; }
  .barre .ligne { display:flex; gap:16px; }
  .barre button { width:120px; padding:16px; font-size:18px; border:none; border-radius:14px; background:#6c4cff; color:#fff; }
  .barre button.non { background:#444; }
  .barre p { margin:0; font-size:14px; color:#ccc; }
  #veille { display:none; position:fixed; inset:0; background:#000; z-index:6; touch-action:none; }
  #sortie { display:none; position:fixed; top:0; right:0; width:70px; height:70px; background:transparent; border:none; z-index:10; }
</style>
</head>
<body>

<div id="manque">
  <p>Aucun faux fond d'écran enregistré.</p>
  <button class="principal" onclick="location.href='index.html'">Retour à Magic Photo</button>
</div>

<div id="accueil"></div>
<div id="camera">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="suivi"></canvas>
  <button id="declencheur"></button>
</div>
<canvas id="resultat"></canvas>

<div id="bApercu" class="barre">
  <p>Le cadre bleu est-il bien placé ?</p>
  <div class="ligne"><button id="oui">Oui</button><button id="non" class="non">Non</button></div>
</div>
<div id="bManuel" class="barre">
  <p id="info"></p>
  <div class="ligne"><button id="ok">OK</button></div>
</div>

<div id="veille"></div>
<button id="sortie"></button>

<script>
var CARTES = 'cartes/';
var VALEURS = { HD:1, DH:2, DD:3, DB:4, BD:5, BB:6, BG:7, GB:8, GG:9, GH:10, HG:11, HH:12, HB:13 };
var COULEURS = { H:'pique', D:'coeur', B:'trefle', G:'carreau' };

var stream = null, snap = null, coins = [], rep = {}, actif = -1, mode = '', boucle = null;
var saisie = [], depart = null, fini = false;
var video = document.getElementById('video');
var cv = document.getElementById('resultat');
var ctx = cv.getContext('2d');
var suivi = document.getElementById('suivi');
var sctx = suivi.getContext('2d');
var veille = document.getElementById('veille');

// 1. Le faux fond d'écran enregistré dans les Paramètres
var fond = null;
try { fond = localStorage.getItem('magicphoto_fond'); } catch (e) {}
if (fond) {
  var acc = document.getElementById('accueil');
  acc.style.backgroundImage = "url('" + fond + "')";
  acc.style.display = 'block';
  document.getElementById('sortie').style.display = 'block';
} else {
  document.getElementById('manque').style.display = 'flex';
}

// 2. Détection d'un rectangle clair (la carte). Renvoie 4 points (haut gauche, haut droit, bas droit, bas gauche) entre 0 et 1, ou null.
function aire(p) {
  var a = 0;
  for (var i = 0; i < 4; i++) { var j = (i + 1) % 4; a += p[i][0] * p[j][1] - p[j][0] * p[i][1]; }
  return Math.abs(a) / 2;
}
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function detecter(src, W) {
  var sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
  if (!sw || !sh) return null;
  var w = W, h = Math.round(W * sh / sw), n = w * h;
  var c = detecter.c || (detecter.c = document.createElement('canvas'));
  c.width = w; c.height = h;
  var cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(src, 0, 0, w, h);
  var d = cx.getImageData(0, 0, w, h).data;

  var bl = new Uint8Array(n), hist = new Array(256).fill(0), i, t;
  for (i = 0; i < n; i++) {
    var m = Math.min(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
    bl[i] = m; hist[m]++;
  }
  var somme = 0;
  for (t = 0; t < 256; t++) somme += t * hist[t];
  var sB = 0, wB = 0, vmax = -1, seuil = 128;
  for (t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    var wF = n - wB;
    if (!wF) break;
    sB += t * hist[t];
    var mB = sB / wB, mF = (somme - sB) / wF;
    var v = wB * wF * (mB - mF) * (mB - mF);
    if (v > vmax) { vmax = v; seuil = t; }
  }

  var lab = new Uint8Array(n), stack = new Int32Array(n), pix = new Int32Array(n);
  var rmin = new Int16Array(h), rmax = new Int16Array(h);
  var meilleur = null, meilleurScore = 0;

  for (var s = 0; s < n; s++) {
    if (bl[s] <= seuil || lab[s]) continue;
    var cnt = 0, top = 0;
    stack[top++] = s; lab[s] = 1;
    while (top) {
      var p = stack[--top];
      pix[cnt++] = p;
      var x = p % w, y = (p - x) / w;
      if (x > 0 && !lab[p - 1] && bl[p - 1] > seuil) { lab[p - 1] = 1; stack[top++] = p - 1; }
      if (x < w - 1 && !lab[p + 1] && bl[p + 1] > seuil) { lab[p + 1] = 1; stack[top++] = p + 1; }
      if (y > 0 && !lab[p - w] && bl[p - w] > seuil) { lab[p - w] = 1; stack[top++] = p - w; }
      if (y < h - 1 && !lab[p + w] && bl[p + w] > seuil) { lab[p + w] = 1; stack[top++] = p + w; }
    }
    if (cnt < n * 0.03 || cnt > n * 0.8) continue;

    rmin.fill(w); rmax.fill(-1);
    var a1 = 1e9, a2 = -1e9, b1 = 1e9, b2 = -1e9, tl, br, tr, bl2;
    for (var k = 0; k < cnt; k++) {
      var q = pix[k], qx = q % w, qy = (q - qx) / w;
      var sm = qx + qy, df = qx - qy;
      if (sm < a1) { a1 = sm; tl = [qx, qy]; }
      if (sm > a2) { a2 = sm; br = [qx, qy]; }
      if (df > b2) { b2 = df; tr = [qx, qy]; }
      if (df < b1) { b1 = df; bl2 = [qx, qy]; }
      if (qx < rmin[qy]) rmin[qy] = qx;
      if (qx > rmax[qy]) rmax[qy] = qx;
    }
    var span = 0;
    for (var r = 0; r < h; r++) if (rmax[r] >= 0) span += rmax[r] - rmin[r] + 1;

    var quad = [tl, tr, br, bl2];
    var qa = aire(quad);
    if (qa < 1) continue;
    var rect = span / qa;
    if (rect < 0.8 || rect > 1.2) continue;
    if (cnt / span < 0.45) continue;
    var lw = (dist(tl, tr) + dist(bl2, br)) / 2, lh = (dist(tl, bl2) + dist(tr, br)) / 2;
    var ratio = lw / lh;
    if (ratio < 0.4 || ratio > 1.1) continue;
    var score = span * (1 - Math.abs(1 - rect));
    if (score > meilleurScore) { meilleurScore = score; meilleur = quad; }
  }
  if (!meilleur) return null;
  return meilleur.map(function (p) { return { x: p[0] / w, y: p[1] / h }; });
}

// 3. Un tap sur le faux accueil ouvre la caméra, avec le suivi en direct
document.getElementById('accueil').onclick = function () {
  this.style.display = 'none';
  document.getElementById('camera').style.display = 'block';
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(function (s) { stream = s; video.srcObject = s; video.play(); demarrerSuivi(); })
    .catch(function () { alert("Impossible d'ouvrir la caméra. Autorise-la dans le navigateur."); });
};

function demarrerSuivi() {
  suivi.width = window.innerWidth;
  suivi.height = window.innerHeight;
  boucle = setInterval(function () {
    if (!video.videoWidth) return;
    sctx.clearRect(0, 0, suivi.width, suivi.height);
    var q = detecter(video, 200);
    if (!q) return;
    var vw = video.videoWidth, vh = video.videoHeight;
    var k = Math.max(suivi.width / vw, suivi.height / vh);
    var ox = (suivi.width - vw * k) / 2, oy = (suivi.height - vh * k) / 2;
    sctx.strokeStyle = 'rgba(80,170,255,0.9)';
    sctx.lineWidth = 3;
    sctx.beginPath();
    q.forEach(function (p, i) {
      var px = ox + p.x * vw * k, py = oy + p.y * vh * k;
      if (i) sctx.lineTo(px, py); else sctx.moveTo(px, py);
    });
    sctx.closePath();
    sctx.stroke();
  }, 150);
}

// 4. Prise de la photo, puis aperçu avec le cadre bleu
document.getElementById('declencheur').onclick = function () {
  clearInterval(boucle);
  snap = document.createElement('canvas');
  snap.width = video.videoWidth;
  snap.height = video.videoHeight;
  snap.getContext('2d').drawImage(video, 0, 0);
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  document.getElementById('camera').style.display = 'none';

  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  cv.style.display = 'block';
  rep.s = Math.min(cv.width / snap.width, cv.height / snap.height);
  var w = snap.width * rep.s, h = snap.height * rep.s;
  rep.ox = (cv.width - w) / 2;
  rep.oy = (cv.height - h) / 2;

  var q = detecter(snap, 480);
  if (q) {
    coins = q.map(function (p) {
      return { x: rep.ox + p.x * snap.width * rep.s, y: rep.oy + p.y * snap.height * rep.s };
    });
    passer('apercu');
  } else {
    var cw = w * 0.3, ch = h * 0.4, cx = cv.width / 2, cy = cv.height / 2;
    coins = [
      { x: cx - cw / 2, y: cy - ch / 2 }, { x: cx + cw / 2, y: cy - ch / 2 },
      { x: cx + cw / 2, y: cy + ch / 2 }, { x: cx - cw / 2, y: cy + ch / 2 }
    ];
    document.getElementById('info').textContent = "Carte non détectée : place les coins, puis OK";
    passer('manuel');
  }
  if (navigator.vibrate) navigator.vibrate(30);
};

function passer(m) {
  mode = m;
  if (m === 'manuel' && !document.getElementById('info').textContent) {
    document.getElementById('info').textContent = "Ajuste les coins, puis OK";
  }
  dessiner();
  document.getElementById('bApercu').style.display = m === 'apercu' ? 'flex' : 'none';
  document.getElementById('bManuel').style.display = m === 'manuel' ? 'flex' : 'none';
}

function dessiner() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(snap, rep.ox, rep.oy, snap.width * rep.s, snap.height * rep.s);
  ctx.beginPath();
  coins.forEach(function (p, i) {
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(40,120,255,0.35)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,190,255,0.95)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (mode === 'manuel') {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    coins.forEach(function (p) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 14, 0, 6.2832);
      ctx.stroke();
    });
  }
}

document.getElementById('non').onclick = function () {
  document.getElementById('info').textContent = "Ajuste les coins, puis OK";
  passer('manuel');
};
document.getElementById('oui').onclick = entrerVeille;
document.getElementById('ok').onclick = entrerVeille;

function entrerVeille() {
  document.getElementById('bApercu').style.display = 'none';
  document.getElementById('bManuel').style.display = 'none';
  veille.style.display = 'block';
  if (navigator.vibrate) navigator.vibrate(30);
}

// 5. Réglage manuel des coins
function position(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.onpointerdown = function (e) {
  if (mode !== 'manuel') return;
  var p = position(e), meilleur = 50;
  actif = -1;
  coins.forEach(function (c, i) {
    var d = Math.hypot(c.x - p.x, c.y - p.y);
    if (d < meilleur) { meilleur = d; actif = i; }
  });
};
cv.onpointermove = function (e) {
  if (mode !== 'manuel' || actif < 0) return;
  coins[actif] = position(e);
  dessiner();
};
cv.onpointerup = function () { actif = -1; };

// 6. Lecture des 3 swipes sur l'écran noir
veille.onpointerdown = function (e) { depart = { x: e.clientX, y: e.clientY }; };
veille.onpointerup = function (e) {
  if (!depart || fini) return;
  var dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  depart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'D' : 'G') : (dy > 0 ? 'B' : 'H');
  saisie.push(d);
  if (saisie.length === 3) { fini = true; terminer(); }
};

function terminer() {
  var v = VALEURS[saisie[0] + saisie[1]];
  var c = COULEURS[saisie[2]];
  var img = new Image();
  img.onload = function () {
    remplacer(img);
    snap.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'IMG_' + Date.now() + '.jpg';
      document.body.appendChild(a);
      a.click();
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      setTimeout(function () { location.href = 'index.html'; }, 1500);
    }, 'image/jpeg', 0.95);
  };
  img.onerror = function () {
    alert('Image introuvable : ' + CARTES + v + '-' + c + '.jpg');
    saisie = []; fini = false;
  };
  img.src = CARTES + v + '-' + c + '.jpg';
}

// 7. Remplacement de la carte en perspective
function remplacer(img) {
  var q = coins.map(function (p) {
    return { x: (p.x - rep.ox) / rep.s, y: (p.y - rep.oy) / rep.s };
  });
  var X = q.map(function (p) { return p.x; });
  var Y = q.map(function (p) { return p.y; });
  var len = function (i, j) { return Math.hypot(X[i] - X[j], Y[i] - Y[j]); };
  var w = Math.max(10, Math.round((len(0, 1) + len(3, 2)) / 2));
  var h = Math.max(10, Math.round((len(0, 3) + len(1, 2)) / 2));

  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var tc = tmp.getContext('2d');
  tc.imageSmoothingQuality = 'high';
  tc.drawImage(img, 0, 0, w, h);
  var src = tc.getImageData(0, 0, w, h).data;

  var sx = X[0] - X[1] + X[2] - X[3], sy = Y[0] - Y[1] + Y[2] - Y[3];
  var dx1 = X[1] - X[2], dx2 = X[3] - X[2], dy1 = Y[1] - Y[2], dy2 = Y[3] - Y[2];
  var det = dx1 * dy2 - dx2 * dy1;
  var g = (sx * dy2 - dx2 * sy) / det, hh = (dx1 * sy - sx * dy1) / det;
  var a = X[1] - X[0] + g * X[1], b = X[3] - X[0] + hh * X[3], c0 = X[0];
  var d = Y[1] - Y[0] + g * Y[1], e = Y[3] - Y[0] + hh * Y[3], f = Y[0];
  var A = e - f * hh, B = c0 * hh - b, C = b * f - c0 * e;
  var D = f * g - d, E = a - c0 * g, F = c0 * d - a * f;
  var G = d * hh - e * g, H = b * g - a * hh, I = a * e - b * d;

  var W = snap.width, Hh = snap.height;
  var x0 = Math.max(0, Math.floor(Math.min.apply(null, X)));
  var x1 = Math.min(W - 1, Math.ceil(Math.max.apply(null, X)));
  var y0 = Math.max(0, Math.floor(Math.min.apply(null, Y)));
  var y1 = Math.min(Hh - 1, Math.ceil(Math.max.apply(null, Y)));

  var sc = snap.getContext('2d');
  var im = sc.getImageData(0, 0, W, Hh);
  var out = im.data;
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var den = G * x + H * y + I;
      var u = (A * x + B * y + C) / den, v = (D * x + E * y + F) / den;
      if (u < 0 || u > 1 || v < 0 || v > 1) continue;
      var fx = u * (w - 1), fy = v * (h - 1);
      var ix = Math.floor(fx), iy = Math.floor(fy);
      var tx = fx - ix, ty = fy - iy;
      var ix2 = Math.min(ix + 1, w - 1), iy2 = Math.min(iy + 1, h - 1);
      var o = (y * W + x) * 4;
      for (var k = 0; k < 3; k++) {
        var p00 = src[(iy * w + ix) * 4 + k], p10 = src[(iy * w + ix2) * 4 + k];
        var p01 = src[(iy2 * w + ix) * 4 + k], p11 = src[(iy2 * w + ix2) * 4 + k];
        out[o + k] = (p00 * (1 - tx) + p10 * tx) * (1 - ty) + (p01 * (1 - tx) + p11 * tx) * ty;
      }
      out[o + 3] = 255;
    }
  }
  sc.putImageData(im, 0, 0);
}

// 8. Sortie secrète : double tap en haut à droite
var dernier = 0;
document.getElementById('sortie').onclick = function () {
  var maintenant = Date.now();
  if (maintenant - dernier < 500) { location.href = 'index.html'; }
  dernier = maintenant;
};
</script>
</body>
</html>
