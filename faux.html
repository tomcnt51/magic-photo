<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Magic Photo</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:sans-serif; touch-action:manipulation; }
  #manque { display:none; height:100%; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px; box-sizing:border-box; }
  button.principal { width:260px; padding:18px; font-size:18px; border:none; border-radius:14px; background:#6c4cff; color:#fff; }
  #accueil { display:none; position:fixed; inset:0; background-size:cover; background-position:center; }
  #camera { display:none; position:fixed; inset:0; background:#000; }
  #video { width:100%; height:100%; object-fit:cover; }
  #declencheur { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); width:74px; height:74px; border-radius:50%; background:#fff; border:6px solid #888; }
  #resultat { display:none; position:fixed; inset:0; width:100%; height:100%; touch-action:none; background:#000; }
  #veille { display:none; position:fixed; inset:0; background:#000; z-index:6; touch-action:none; }
  #sortie { display:none; position:fixed; top:0; right:0; width:70px; height:70px; background:transparent; border:none; z-index:10; }
</style>
</head>
<body>

<div id="manque">
  <p>Aucun faux fond d'écran enregistré.</p>
  <button class="principal" onclick="location.href='index.html'">Retour à Magic Photo</button>
</div>

<div id="accueil"></div>
<div id="camera">
  <video id="video" playsinline muted autoplay></video>
  <button id="declencheur"></button>
</div>
<canvas id="resultat"></canvas>
<div id="veille"></div>
<button id="sortie"></button>

<script>
var CARTES = 'cartes/';
var VALEURS = { HD:1, DH:2, DD:3, DB:4, BD:5, BB:6, BG:7, GB:8, GG:9, GH:10, HG:11, HH:12, HB:13 };
var COULEURS = { H:'pique', D:'coeur', B:'trefle', G:'carreau' };

var stream = null, snap = null, coins = [], rep = {}, minuteur = null, actif = -1;
var saisie = [], depart = null, fini = false;
var video = document.getElementById('video');
var cv = document.getElementById('resultat');
var ctx = cv.getContext('2d');
var veille = document.getElementById('veille');

// 1. Le faux fond d'écran enregistré dans les Paramètres
var fond = null;
try { fond = localStorage.getItem('magicphoto_fond'); } catch (e) {}
if (fond) {
  var acc = document.getElementById('accueil');
  acc.style.backgroundImage = "url('" + fond + "')";
  acc.style.display = 'block';
  document.getElementById('sortie').style.display = 'block';
} else {
  document.getElementById('manque').style.display = 'flex';
}

// 2. Un tap sur le faux accueil ouvre la caméra
document.getElementById('accueil').onclick = function () {
  this.style.display = 'none';
  document.getElementById('camera').style.display = 'block';
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(function (s) { stream = s; video.srcObject = s; video.play(); })
    .catch(function () { alert("Impossible d'ouvrir la caméra. Autorise-la dans Chrome."); });
};

// 3. Prise de la photo
document.getElementById('declencheur').onclick = function () {
  snap = document.createElement('canvas');
  snap.width = video.videoWidth;
  snap.height = video.videoHeight;
  snap.getContext('2d').drawImage(video, 0, 0);
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  document.getElementById('camera').style.display = 'none';

  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  cv.style.display = 'block';
  rep.s = Math.min(cv.width / snap.width, cv.height / snap.height);
  var w = snap.width * rep.s, h = snap.height * rep.s;
  rep.ox = (cv.width - w) / 2;
  rep.oy = (cv.height - h) / 2;

  var cw = w * 0.3, ch = h * 0.4, cx = cv.width / 2, cy = cv.height / 2;
  coins = [
    { x: cx - cw / 2, y: cy - ch / 2 },
    { x: cx + cw / 2, y: cy - ch / 2 },
    { x: cx + cw / 2, y: cy + ch / 2 },
    { x: cx - cw / 2, y: cy + ch / 2 }
  ];
  dessiner();
  armerVeille();
  if (navigator.vibrate) navigator.vibrate(30);
};

// 4. Le rectangle (coins : haut gauche, haut droit, bas droit, bas gauche)
function dessiner() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(snap, rep.ox, rep.oy, snap.width * rep.s, snap.height * rep.s);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  coins.forEach(function (p, i) {
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.stroke();
  coins.forEach(function (p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, 6.2832);
    ctx.stroke();
  });
}

function position(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.onpointerdown = function (e) {
  armerVeille();
  var p = position(e), meilleur = 50;
  actif = -1;
  coins.forEach(function (c, i) {
    var d = Math.hypot(c.x - p.x, c.y - p.y);
    if (d < meilleur) { meilleur = d; actif = i; }
  });
};
cv.onpointermove = function (e) {
  if (actif < 0) return;
  armerVeille();
  coins[actif] = position(e);
  dessiner();
};
cv.onpointerup = function () { actif = -1; };

// 5. Fausse veille après 15 secondes
function armerVeille() {
  clearTimeout(minuteur);
  minuteur = setTimeout(function () { veille.style.display = 'block'; }, 15000);
}

// 6. Lecture des 3 swipes
veille.onpointerdown = function (e) { depart = { x: e.clientX, y: e.clientY }; };
veille.onpointerup = function (e) {
  if (!depart || fini) return;
  var dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  depart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'D' : 'G') : (dy > 0 ? 'B' : 'H');
  saisie.push(d);
  if (saisie.length === 3) { fini = true; terminer(); }
};

function terminer() {
  var v = VALEURS[saisie[0] + saisie[1]];
  var c = COULEURS[saisie[2]];
  var img = new Image();
  img.onload = function () {
    remplacer(img);
    snap.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'IMG_' + Date.now() + '.jpg';
      document.body.appendChild(a);
      a.click();
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      setTimeout(function () { location.href = 'index.html'; }, 1500);
    }, 'image/jpeg', 0.95);
  };
  img.onerror = function () {
    alert('Image introuvable : ' + CARTES + v + '-' + c + '.jpg');
    saisie = []; fini = false;
  };
  img.src = CARTES + v + '-' + c + '.jpg';
}

// 7. Remplacement de la carte en perspective
function remplacer(img) {
  var q = coins.map(function (p) {
    return { x: (p.x - rep.ox) / rep.s, y: (p.y - rep.oy) / rep.s };
  });
  var X = q.map(function (p) { return p.x; });
  var Y = q.map(function (p) { return p.y; });
  var len = function (i, j) { return Math.hypot(X[i] - X[j], Y[i] - Y[j]); };
  var w = Math.max(10, Math.round((len(0, 1) + len(3, 2)) / 2));
  var h = Math.max(10, Math.round((len(0, 3) + len(1, 2)) / 2));

  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var tc = tmp.getContext('2d');
  tc.imageSmoothingQuality = 'high';
  tc.drawImage(img, 0, 0, w, h);
  var src = tc.getImageData(0, 0, w, h).data;

  var sx = X[0] - X[1] + X[2] - X[3], sy = Y[0] - Y[1] + Y[2] - Y[3];
  var dx1 = X[1] - X[2], dx2 = X[3] - X[2], dy1 = Y[1] - Y[2], dy2 = Y[3] - Y[2];
  var det = dx1 * dy2 - dx2 * dy1;
  var g = (sx * dy2 - dx2 * sy) / det, hh = (dx1 * sy - sx * dy1) / det;
  var a = X[1] - X[0] + g * X[1], b = X[3] - X[0] + hh * X[3], c0 = X[0];
  var d = Y[1] - Y[0] + g * Y[1], e = Y[3] - Y[0] + hh * Y[3], f = Y[0];
  var A = e - f * hh, B = c0 * hh - b, C = b * f - c0 * e;
  var D = f * g - d, E = a - c0 * g, F = c0 * d - a * f;
  var G = d * hh - e * g, H = b * g - a * hh, I = a * e - b * d;

  var W = snap.width, Hh = snap.height;
  var x0 = Math.max(0, Math.floor(Math.min.apply(null, X)));
  var x1 = Math.min(W - 1, Math.ceil(Math.max.apply(null, X)));
  var y0 = Math.max(0, Math.floor(Math.min.apply(null, Y)));
  var y1 = Math.min(Hh - 1, Math.ceil(Math.max.apply(null, Y)));

  var sc = snap.getContext('2d');
  var im = sc.getImageData(0, 0, W, Hh);
  var out = im.data;
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var den = G * x + H * y + I;
      var u = (A * x + B * y + C) / den, v = (D * x + E * y + F) / den;
      if (u < 0 || u > 1 || v < 0 || v > 1) continue;
      var fx = u * (w - 1), fy = v * (h - 1);
      var ix = Math.floor(fx), iy = Math.floor(fy);
      var tx = fx - ix, ty = fy - iy;
      var ix2 = Math.min(ix + 1, w - 1), iy2 = Math.min(iy + 1, h - 1);
      var o = (y * W + x) * 4;
      for (var k = 0; k < 3; k++) {
        var p00 = src[(iy * w + ix) * 4 + k], p10 = src[(iy * w + ix2) * 4 + k];
        var p01 = src[(iy2 * w + ix) * 4 + k], p11 = src[(iy2 * w + ix2) * 4 + k];
        out[o + k] = (p00 * (1 - tx) + p10 * tx) * (1 - ty) + (p01 * (1 - tx) + p11 * tx) * ty;
      }
      out[o + 3] = 255;
    }
  }
  sc.putImageData(im, 0, 0);
}

// 8. Sortie secrète : double tap en haut à droite
var dernier = 0;
document.getElementById('sortie').onclick = function () {
  var maintenant = Date.now();
  if (maintenant - dernier < 500) { location.href = 'index.html'; }
  dernier = maintenant;
};
</script>
</body>
</html>
