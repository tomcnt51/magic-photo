<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Photo</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111; color:#fff; font-family:sans-serif; text-align:center; }
  .vue { display:none; flex-direction:column; align-items:center; gap:20px; padding:20px; }
  .vue.actif { display:flex; }
  h1 { font-size:32px; margin:0 0 20px; }
  button { width:260px; padding:18px; font-size:20px; border:none; border-radius:14px; background:#6c4cff; color:#fff; }
  button.second { background:#333; }
  p { margin:0; color:#aaa; }
</style>
</head>
<body>

<div id="menu" class="vue actif">
  <h1>Magic Photo</h1>
  <button id="demarrer">Démarrer</button>
  <button id="params" class="second">Paramètres</button>
</div>

<div id="reglages" class="vue">
  <h1>Paramètres</h1>
  <p id="etat"></p>
  <button id="choisir">Choisir mon faux fond d'écran</button>
  <button id="retour" class="second">Retour</button>
  <input type="file" id="fichier" accept="image/*" style="display:none">
</div>

<script>
var CLE = 'magicphoto_fond';

function lire() {
  try { return localStorage.getItem(CLE); } catch (e) { return null; }
}

function montrer(nom) {
  document.getElementById('menu').className = 'vue' + (nom === 'menu' ? ' actif' : '');
  document.getElementById('reglages').className = 'vue' + (nom === 'reglages' ? ' actif' : '');
  if (nom === 'reglages') {
    document.getElementById('etat').textContent = lire() ? "Faux fond d'écran : enregistré" : "Faux fond d'écran : aucun";
  }
}

document.getElementById('demarrer').onclick = function () {
  if (!lire()) {
    alert("Choisis d'abord ton faux fond d'écran dans Paramètres.");
    montrer('reglages');
  } else {
    location.href = 'faux.html';
  }
};
document.getElementById('params').onclick = function () { montrer('reglages'); };
document.getElementById('retour').onclick = function () { montrer('menu'); };
document.getElementById('choisir').onclick = function () { document.getElementById('fichier').click(); };

document.getElementById('fichier').onchange = function () {
  var input = this;
  var file = input.files[0];
  if (!file) return;
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function () {
    var s = Math.min(1, 2400 / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width * s);
    c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try {
      localStorage.setItem(CLE, c.toDataURL('image/jpeg', 0.92));
      alert("Le fond d'écran a bien été modifié.");
      montrer('menu');
    } catch (e) {
      alert("Impossible d'enregistrer cette image.");
    }
    URL.revokeObjectURL(url);
    input.value = '';
  };
  img.onerror = function () { alert("Image illisible."); input.value = ''; };
  img.src = url;
};
</script>
</body>
</html>
